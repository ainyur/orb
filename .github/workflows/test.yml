name: test

on: [push, pull_request]

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-14 libx11-dev
      - run: make test CC=gcc-14
      - run: make CC=gcc-14

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p "$HOME/bin"
          cp "$(command -v mingw32-make)" "$HOME/bin/make.exe"
          cygpath -w "$HOME/bin" >> "$GITHUB_PATH"
      - run: gcc --version && make --version
      - run: make test
      - run: make
