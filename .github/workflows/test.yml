name: test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    container: gcc:15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: apt-get update && apt-get install -y make libx11-dev libasound2-dev
      - run: gcc --version && make --version
      - run: make test
      - run: make test-asan
      - run: make
      - run: make release GAME=examples/demo
      # Keeps the Linux binaries running on glibc 2.38.
      - run: |
          objdump -T bin/orb examples/demo/bin/demo > symbols.txt
          ! grep -E "GLIBC_2\.(39|[4-9][0-9])" symbols.txt

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          mkdir -p "$HOME/bin"
          cp "$(command -v mingw32-make)" "$HOME/bin/make.exe"
          cygpath -w "$HOME/bin" >> "$GITHUB_PATH"
      - run: gcc --version && make --version
      - run: make test
      - run: make
      - run: make release GAME=examples/demo
      # mingw's own DLLs, such as libssp-0.dll and libwinpthread-1.dll, are not on a player's machine.
      - run: |
          objdump -p bin/orb.exe examples/demo/bin/demo.exe > imports.txt
          ! grep -i "DLL Name: lib" imports.txt
