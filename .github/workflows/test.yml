name: test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    container: gcc:15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: apt-get update && apt-get install -y make libx11-dev libasound2-dev
      - run: gcc --version && make --version
      - run: make CFLAGS=-Werror test
      - run: make CFLAGS=-Werror test-asan
      - run: make CFLAGS=-Werror
      - run: make CFLAGS=-Werror release GAME=examples/demo
      # Keeps the Linux binaries running on glibc 2.38.
      - run: |
          objdump -T bin/orb examples/demo/bin/demo > symbols.txt
          ! grep -E "GLIBC_2\.(39|[4-9][0-9])" symbols.txt

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          install: make mingw-w64-ucrt-x86_64-gcc
      - run: gcc --version && make --version
      - run: make CFLAGS=-Werror test
      - run: make CFLAGS=-Werror
      - run: make CFLAGS=-Werror release GAME=examples/demo
      # mingw's own DLLs, such as libssp-0.dll and libwinpthread-1.dll, are not on a player's machine.
      - run: |
          objdump -p bin/orb.exe > orb.txt
          objdump -p examples/demo/bin/demo.exe > demo.txt
          ! grep -i "DLL Name: lib" orb.txt demo.txt

  # Clang 21 is the oldest Clang orb supports.
  linux-clang:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm --needed clang21 make git libx11 alsa-lib
      - run: echo /usr/lib/llvm21/bin >> "$GITHUB_PATH"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: clang --version && make --version
      - run: make CC=clang CFLAGS=-Werror test
      - run: make CC=clang CFLAGS=-Werror
      - run: make CC=clang CFLAGS=-Werror release GAME=examples/demo

  windows-clang-asan:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: CLANG64
          install: make mingw-w64-clang-x86_64-clang
      - run: clang --version && make --version
      - run: make CC=clang CFLAGS=-Werror test-asan
