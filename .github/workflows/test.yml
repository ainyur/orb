name: test

on: [push, pull_request]

jobs:
  linux:
    runs-on: ubuntu-latest
    container: gcc:15
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y make libx11-dev
      - run: gcc --version && make --version
      - run: make test
      - run: make

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p "$HOME/bin"
          cp "$(command -v mingw32-make)" "$HOME/bin/make.exe"
          cygpath -w "$HOME/bin" >> "$GITHUB_PATH"
      - run: gcc --version && make --version
      - run: make test
      - run: make
