name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    container: gcc:15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: apt-get update && apt-get install -y make libx11-dev libasound2-dev
      - run: make test
      - run: make
      - run: make release GAME=examples/demo
      # Keeps the Linux binaries running on glibc 2.38.
      - run: |
          objdump -T bin/orb examples/demo/bin/demo > symbols.txt
          ! grep -E "GLIBC_2\.(39|[4-9][0-9])" symbols.txt
      # Tarballs keep the executable bit, which the artifact's zip drops.
      - run: |
          mkdir dist
          tar -czf dist/orb-linux.tar.gz -C bin orb
          tar -czf dist/demo-linux.tar.gz -C examples/demo/bin demo
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          mkdir -p "$HOME/bin"
          cp "$(command -v mingw32-make)" "$HOME/bin/make.exe"
          cygpath -w "$HOME/bin" >> "$GITHUB_PATH"
      - run: make test
      - run: make
      - run: make release GAME=examples/demo
      # mingw's own DLLs, such as libssp-0.dll and libwinpthread-1.dll, are not on a player's machine.
      - run: |
          objdump -p bin/orb.exe > orb.txt
          objdump -p examples/demo/bin/demo.exe > demo.txt
          ! grep -i "DLL Name: lib" orb.txt demo.txt
      - run: |
          mkdir dist
          cp bin/orb.exe examples/demo/bin/demo.exe dist/
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/

  publish:
    if: github.ref_type == 'tag'
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
